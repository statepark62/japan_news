name: build-news

on:
  schedule:
    # GitHub cron 은 UTC 기준. KST = UTC+9  →  07:00 KST = 22:00 UTC
    # 예약 실행은 가끔 조용히 건너뛰어질 수 있어(GitHub 인프라 특성, 특히 정각에 몰릴 때)
    # 20분 간격으로 3번 겹쳐서 안전망을 둔다. 카페는 already_posted_today 로 하루 1회만 게시되므로
    # 여러 번 걸려도 중복 게시되지 않는다.
    - cron: "0 22 * * *"    # 07:00 KST
    - cron: "20 22 * * *"   # 07:20 KST
    - cron: "40 22 * * *"   # 07:40 KST
  workflow_dispatch:        # Actions 탭에서 수동 실행(즉시 갱신)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Collect news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GAS_SHEET_URL: ${{ secrets.GAS_SHEET_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          NAVER_LOGIN_CLIENT_ID: ${{ secrets.NAVER_LOGIN_CLIENT_ID }}
          NAVER_LOGIN_CLIENT_SECRET: ${{ secrets.NAVER_LOGIN_CLIENT_SECRET }}
          NAVER_CAFE_CLUB_ID: ${{ secrets.NAVER_CAFE_CLUB_ID }}
          NAVER_CAFE_MENU_ID: ${{ secrets.NAVER_CAFE_MENU_ID }}
        run: python scripts/collect.py

      - name: Threads에 오늘의 최상위 뉴스 게시
        continue-on-error: true  # Threads 게시가 실패해도 news.json 커밋은 계속 진행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        working-directory: scripts/threads
        run: python hibi_to_threads.py --news ../../docs/news.json

      - name: Commit news.json
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json docs/vocab.json state/analysis_cache.json state/cafe_cap.json state/cafe_posted.json scripts/threads/last_posted_date.txt
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "news: update $(date -u +'%Y-%m-%d %H:%M')Z"
            git push
          fi
